<!-- templates/inventory/tool_form.html -->
{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1 class="mb-4">{{ title }}</h1>

        <form method="post" action="{{ action_url }}" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="card mb-4">
                <div class="card-header">
                    <h5>Основные данные</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="name" class="form-label">Наименование *</label>
                        <input type="text" class="form-control" id="name" name="name" required
                               value="{{ tool.name|default:'' }}">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="inventory_number" class="form-label">Инвентарный номер *</label>
                            <input type="text" class="form-control" id="inventory_number" name="inventory_number" required
                                   value="{{ tool.inventory_number|default:'' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="serial_number" class="form-label">Серийный номер</label>
                            <input type="text" class="form-control" id="serial_number" name="serial_number"
                                   value="{{ tool.serial_number|default:'' }}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">
                    <h5>Классификация</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="category" class="form-label">Категория</label>
                            <select class="form-control" id="category" name="category">
                                <option value="">-- Не выбрана --</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if tool.category.id == cat.id %}selected{% endif %}>
                                    {{ cat.get_full_path }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="manufacturer" class="form-label">Производитель</label>
                            <select class="form-control" id="manufacturer" name="manufacturer">
                                <option value="">-- Не выбран --</option>
                                {% for man in manufacturers %}
                                <option value="{{ man.id }}" {% if tool.manufacturer.id == man.id %}selected{% endif %}>
                                    {{ man.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="model" class="form-label">Модель</label>
                            <input type="text" class="form-control" id="model" name="model"
                                   value="{{ tool.model|default:'' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="year_of_manufacture" class="form-label">Год выпуска</label>
                            <input type="number" class="form-control" id="year_of_manufacture" name="year_of_manufacture"
                                   value="{{ tool.year_of_manufacture|default:'' }}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">
                    <h5>Учёт</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="status" class="form-label">Статус</label>
                            <select class="form-control" id="status" name="status">
                                <option value="available" {% if tool.status == 'available' or not tool %}selected{% endif %}>Доступен</option>
                                <option value="in_use" {% if tool.status == 'in_use' %}selected{% endif %}>Выдан</option>
                                <option value="maintenance" {% if tool.status == 'maintenance' %}selected{% endif %}>На обслуживании</option>
                                <option value="write_off" {% if tool.status == 'write_off' %}selected{% endif %}>Списан</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="location" class="form-label">Место хранения</label>
                            <select class="form-control" id="location" name="location">
                                <option value="">-- Не указано --</option>
                                {% for loc in locations %}
                                <option value="{{ loc.id }}" {% if tool.location.id == loc.id %}selected{% endif %}>
                                    {{ loc.get_full_path }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="purchase_date" class="form-label">Дата приобретения</label>
                            <input type="date" class="form-control" id="purchase_date" name="purchase_date"
                                   value="{{ tool.purchase_date|date:'Y-m-d'|default:'' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="purchase_cost" class="form-label">Стоимость</label>
                            <input type="number" step="0.01" class="form-control" id="purchase_cost" name="purchase_cost"
                                   value="{{ tool.purchase_cost|default:'' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="condition" class="form-label">Техническое состояние</label>
                        <textarea class="form-control" id="condition" name="condition" rows="2">{{ tool.condition|default:'' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="photo" class="form-label">Фото</label>
                        {% if tool.photo %}
                        <div class="mb-2">
                            <img src="{{ tool.photo.url }}" alt="{{ tool.name }}" style="max-height: 100px;">
                        </div>
                        {% endif %}
                        <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/inventory/" class="btn btn-secondary">Отмена</a>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

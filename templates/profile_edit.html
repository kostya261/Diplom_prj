<!-- templates/profile_edit.html -->
{% extends "base.html" %}

{% block title %}Редактирование профиля{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1 class="mb-4">Редактирование профиля</h1>

        <form method="post">
            {% csrf_token %}

            <div class="card mb-4">
                <div class="card-header">
                    <h5>Основная информация</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="first_name" name="first_name"
                                   value="{{ user.first_name|default:'' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label">Фамилия</label>
                            <input type="text" class="form-control" id="last_name" name="last_name"
                                   value="{{ user.last_name|default:'' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ user.email|default:'' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Телефон</label>
                        <input type="text" class="form-control" id="phone" name="phone"
                               value="{{ user.phone|default:'' }}">
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">
                    <h5>Смена пароля</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">Оставьте поля пустыми, если не хотите менять пароль</p>

                    <div class="mb-3">
                        <label for="old_password" class="form-label">Старый пароль</label>
                        <input type="password" class="form-control" id="old_password" name="old_password">
                    </div>

                    <div class="mb-3">
                        <label for="new_password1" class="form-label">Новый пароль</label>
                        <input type="password" class="form-control" id="new_password1" name="new_password1">
                    </div>

                    <div class="mb-3">
                        <label for="new_password2" class="form-label">Подтверждение пароля</label>
                        <input type="password" class="form-control" id="new_password2" name="new_password2">
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/profile/" class="btn btn-secondary">Отмена</a>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

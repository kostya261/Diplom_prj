<!-- templates/users/employee_form.html -->
{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1 class="mb-4">{{ title }}</h1>

        <form method="post" action="{{ action_url }}">
            {% csrf_token %}

            <div class="card mb-4">
                <div class="card-header">
                    <h5>Основные данные</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label">Логин *</label>
                            <input type="text" class="form-control" id="username" name="username" required
                                   value="{{ employee.username|default:'' }}">
                        </div>
                        {% if not employee %}
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Пароль *</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        {% endif %}
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="first_name" name="first_name"
                                   value="{{ employee.first_name|default:'' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label">Фамилия</label>
                            <input type="text" class="form-control" id="last_name" name="last_name"
                                   value="{{ employee.last_name|default:'' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" name="email" required
                                   value="{{ employee.email|default:'' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Телефон</label>
                            <input type="text" class="form-control" id="phone" name="phone"
                                   value="{{ employee.phone|default:'' }}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">
                    <h5>Рабочая информация</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="role" class="form-label">Роль *</label>
                            <select class="form-control" id="role" name="role" required>
                                <option value="">-- Выберите роль --</option>
                                <option value="admin" {% if employee.role == 'admin' %}selected{% endif %}>Администратор</option>
                                <option value="manager" {% if employee.role == 'manager' %}selected{% endif %}>Менеджер</option>
                                <option value="employee" {% if employee.role == 'employee' %}selected{% endif %}>Сотрудник</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="position" class="form-label">Должность</label>
                            <input type="text" class="form-control" id="position" name="position"
                                   value="{{ employee.position|default:'' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="department" class="form-label">Отдел</label>
                            <select class="form-control" id="department" name="department">
                                <option value="">-- Не выбран --</option>
                                {% for dept in departments %}
                                <option value="{{ dept.id }}" {% if employee.department.id == dept.id %}selected{% endif %}>
                                    {{ dept.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">
                    <h5>Паспортные данные (необязательно)</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="passport_series" class="form-label">Серия</label>
                            <input type="text" class="form-control" id="passport_series" name="passport_series"
                                   value="{{ employee.passport_series|default:'' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="passport_number" class="form-label">Номер</label>
                            <input type="text" class="form-control" id="passport_number" name="passport_number"
                                   value="{{ employee.passport_number|default:'' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="passport_code" class="form-label">Код подразделения</label>
                            <input type="text" class="form-control" id="passport_code" name="passport_code"
                                   value="{{ employee.passport_code|default:'' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="passport_issued_by" class="form-label">Кем выдан</label>
                        <input type="text" class="form-control" id="passport_issued_by" name="passport_issued_by"
                               value="{{ employee.passport_issued_by|default:'' }}">
                    </div>
                    <div class="mb-3">
                        <label for="passport_issued_date" class="form-label">Дата выдачи</label>
                        <input type="date" class="form-control" id="passport_issued_date" name="passport_issued_date"
                               value="{{ employee.passport_issued_date|date:'Y-m-d'|default:'' }}">
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">
                    <h5>Адреса (необязательно)</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="registration_address" class="form-label">Адрес регистрации</label>
                        <textarea class="form-control" id="registration_address" name="registration_address" rows="2">{{ employee.registration_address|default:'' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="residential_address" class="form-label">Адрес проживания</label>
                        <textarea class="form-control" id="residential_address" name="residential_address" rows="2">{{ employee.residential_address|default:'' }}</textarea>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="notes" class="form-label">Заметки</label>
                <textarea class="form-control" id="notes" name="notes" rows="2">{{ employee.notes|default:'' }}</textarea>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/employees/" class="btn btn-secondary">Отмена</a>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Загруженность сотрудников{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4">Загруженность сотрудников</h1>
        <p class="lead">Сотрудники, отсортированные по количеству активных задач</p>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Сотрудник</th>
                    <th>Должность</th>
                    <th>Отдел</th>
                    <th>Активных задач</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="employee-load-body">
                <tr>
                    <td colspan="6" class="text-center">Загрузка...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/api/tasks/employee_load/')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('employee-load-body');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">Нет данных</td></tr>';
                    return;
                }

                data.forEach((emp, index) => {
                    const row = `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${emp.full_name}</td>
                            <td>${emp.position || '—'}</td>
                            <td>${emp.department || '—'}</td>
                            <td><span class="badge bg-primary">${emp.active_tasks}</span></td>
                            <td>
                                <a href="/employees/${emp.id}/" class="btn btn-sm btn-info">Профиль</a>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                document.getElementById('employee-load-body').innerHTML =
                    '<tr><td colspan="6" class="text-center text-danger">Ошибка загрузки</td></tr>';
            });
    });
</script>
{% endblock %}
